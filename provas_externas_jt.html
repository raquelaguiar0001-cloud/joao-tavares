<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provas Externas - LabAtivo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0d0618;
      --card-bg: #130a24;
      --accent: #fbbf24;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.5);
      --border: rgba(255, 255, 255, 0.1);
      --danger: #f87171;
      --success: #34d399;
      --info: #22d3ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px;
    }

    .btn-voltar {
      color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: bold;
      background: rgba(251, 191, 36, 0.1); padding: 8px 14px; border-radius: 8px;
      border: 1px solid rgba(251, 191, 36, 0.2); transition: 0.2s;
    }
    .btn-voltar:hover { background: rgba(251, 191, 36, 0.2); }

    h1 { font-size: 1.5rem; color: var(--accent); }

    .card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; user-select: none;
    }

    .btn-toggle {
      background: rgba(255, 255, 255, 0.08); color: var(--accent);
      border: 1px solid var(--border); padding: 5px 12px; border-radius: 6px;
      font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-toggle:hover { background: rgba(251, 191, 36, 0.2); }

    .form-group {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px; margin-top: 15px; margin-bottom: 15px;
    }

    .form-content {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      max-height: 500px; opacity: 1;
    }

    .form-content.collapsed {
      max-height: 0; opacity: 0; margin: 0; padding: 0; pointer-events: none;
    }

    input, select {
      width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 0.9rem; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    button.btn-salvar {
      background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a0a00;
      font-weight: 800; border: none; padding: 10px 20px; border-radius: 8px;
      cursor: pointer; transition: 0.2s;
    }
    button.btn-salvar:hover { transform: translateY(-2px); opacity: 0.9; }

    /* CONTROLES DO GRÁFICO */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      margin-bottom: 20px; background: rgba(255, 255, 255, 0.03);
      padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    }
    .filter-bar label { font-size: 0.85rem; color: var(--text-dim); font-weight: 600; }

    /* GRÁFICO COM ROLAGEM */
    .chart-wrapper { width: 100%; overflow-x: auto; padding-bottom: 10px; }
    .chart-container { position: relative; height: 350px; min-width: 600px; }

    /* TABELA */
    .table-header-tools {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; gap: 10px; flex-wrap: wrap;
    }
    .search-box { max-width: 280px; }

    .table-wrapper { overflow-x: auto; max-height: 400px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase;
      padding: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card-bg);
    }
    td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

    .btn-excluir {
      background: transparent; color: var(--danger); padding: 4px 10px;
      font-size: 0.75rem; border: 1px solid var(--danger); border-radius: 6px; cursor: pointer;
    }
    .btn-excluir:hover { background: rgba(248, 113, 113, 0.1); }

    .badge-prova {
      display: inline-block; padding: 3px 8px; border-radius: 12px;
      font-size: 0.75rem; font-weight: bold; color: #000;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
    <h1>📝 Módulo de Provas Externas</h1>
  </header>

  <!-- FORMULÁRIO COM RECURSO DE MAXIMIZAR/MINIMIZAR -->
  <div class="card">
    <div class="card-header" onclick="toggleForm()">
      <h3 style="font-size: 1.1rem; color: var(--accent);">➕ Adicionar Resultado</h3>
      <button type="button" class="btn-toggle" id="btnToggleForm">➖ Minimizar Painel</button>
    </div>

    <div class="form-content" id="formContent">
      <form id="formProva">
        <div class="form-group">
          <input type="text" id="aluno" placeholder="Nome Completo do Aluno" required>
          <input type="text" id="prova" placeholder="Nome da Prova (ex: Caed Ciclo I, Caed Ciclo II)" required>
          <select id="tipoPontuacao">
            <option value="nota">Nota (ex: 8.5 ou 85)</option>
            <option value="porcentagem">Porcentagem (%) (ex: 85%)</option>
          </select>
          <input type="number" id="nota" placeholder="Valor (ex: 8.5 ou 85)" step="0.1" required>
        </div>
        <button type="submit" class="btn-salvar">+ Salvar Registro</button>
      </form>
    </div>
  </div>

  <!-- GRÁFICO E FILTROS -->
  <div class="card">
    <h3 style="margin-bottom: 15px; font-size: 1.1rem; color: var(--accent);">📊 Painel de Análise Visual</h3>
    
    <div class="filter-bar">
      <div>
        <label>Modo de Visualização:</label>
        <select id="modoVisao" onchange="alternarModo()">
          <option value="geral">Média Geral por Prova</option>
          <option value="individual">Notas por Aluno em 1 Prova</option>
          <option value="comparar">Comparar 2 Provas (Aluno por Aluno)</option>
        </select>
      </div>

      <div id="boxProva1" style="display: none;">
        <label id="lblProva1">Selecionar Prova:</label>
        <select id="selProva1" onchange="desenharGrafico()"></select>
      </div>

      <div id="boxProva2" style="display: none;">
        <label>Comparar com Prova:</label>
        <select id="selProva2" onchange="desenharGrafico()"></select>
      </div>
    </div>

    <div class="chart-wrapper">
      <div class="chart-container" id="containerArea">
        <canvas id="graficoProvas"></canvas>
      </div>
    </div>
  </div>

  <!-- HISTÓRICO DE PROVAS -->
  <div class="card">
    <div class="table-header-tools">
      <h3 style="font-size: 1.1rem; color: var(--accent);">📋 Histórico Geral dos Alunos</h3>
      <input type="text" id="inputBusca" class="search-box" placeholder="🔍 Buscar aluno..." onkeyup="filtrarTabela()">
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Aluno</th>
            <th>Prova / Avaliação</th>
            <th>Nota / Pontuação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaProvas"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let dadosProvas = JSON.parse(localStorage.getItem('labAtivo_provas')) || [];
  let meuGrafico = null;

  // Paleta de Cores Dinâmica por Prova
  const CORES = ['#fbbf24', '#22d3ee', '#a78bfa', '#34d399', '#f472b6', '#fb923c', '#818cf8'];

  function obterCorProva(nomeProva) {
    const provasUnicas = [...new Set(dadosProvas.map(d => d.prova))];
    const index = provasUnicas.indexOf(nomeProva);
    return CORES[index % CORES.length] || '#fbbf24';
  }

  // Minimizar e Expandir Formulário
  function toggleForm() {
    const content = document.getElementById('formContent');
    const btn = document.getElementById('btnToggleForm');
    
    if (content.classList.contains('collapsed')) {
      content.classList.remove('collapsed');
      btn.textContent = '➖ Minimizar Painel';
    } else {
      content.classList.add('collapsed');
      btn.textContent = '➕ Expandir Painel';
    }
  }

  // Inicialização
  function atualizarTudo() {
    salvarDados();
    atualizarTabela();
    atualizarSelects();
    desenharGrafico();
  }

  function salvarDados() {
    localStorage.setItem('labAtivo_provas', JSON.stringify(dadosProvas));
  }

  // Adicionar Dado
  document.getElementById('formProva').addEventListener('submit', (e) => {
    e.preventDefault();
    const aluno = document.getElementById('aluno').value.trim();
    const prova = document.getElementById('prova').value.trim();
    const tipo = document.getElementById('tipoPontuacao').value;
    const nota = parseFloat(document.getElementById('nota').value);

    dadosProvas.push({ aluno, prova, nota, tipo });
    document.getElementById('formProva').reset();
    atualizarTudo();
  });

  // Excluir Registro
  function excluirRegistro(index) {
    if(confirm("Tem certeza que deseja excluir esta nota?")) {
      dadosProvas.splice(index, 1);
      atualizarTudo();
    }
  }

  // Tabela e Filtros
  function atualizarTabela() {
    const tbody = document.getElementById('tabelaProvas');
    tbody.innerHTML = '';

    dadosProvas.forEach((item, index) => {
      const cor = obterCorProva(item.prova);
      const suf = item.tipo === 'porcentagem' ? '%' : '';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${item.aluno}</strong></td>
        <td><span class="badge-prova" style="background:${cor}">${item.prova}</span></td>
        <td><strong style="color: var(--success)">${item.nota}${suf}</strong></td>
        <td><button class="btn-excluir" onclick="excluirRegistro(${index})">Excluir</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filtrarTabela() {
    const busca = document.getElementById('inputBusca').value.toLowerCase();
    const linhas = document.querySelectorAll('#tabelaProvas tr');
    linhas.forEach(linha => {
      const texto = linha.children[0].textContent.toLowerCase();
      linha.style.display = texto.includes(busca) ? '' : 'none';
    });
  }

  // Preencher Selects
  function atualizarSelects() {
    const provas = [...new Set(dadosProvas.map(d => d.prova))];
    const sel1 = document.getElementById('selProva1');
    const sel2 = document.getElementById('selProva2');

    sel1.innerHTML = ''; sel2.innerHTML = '';

    provas.forEach(p => {
      sel1.innerHTML += `<option value="${p}">${p}</option>`;
      sel2.innerHTML += `<option value="${p}">${p}</option>`;
    });

    if (provas.length > 1) sel2.selectedIndex = 1;
  }

  function alternarModo() {
    const modo = document.getElementById('modoVisao').value;
    document.getElementById('boxProva1').style.display = (modo !== 'geral') ? 'block' : 'none';
    document.getElementById('boxProva2').style.display = (modo === 'comparar') ? 'block' : 'none';
    document.getElementById('lblProva1').textContent = (modo === 'comparar') ? '1ª Prova:' : 'Selecionar Prova:';
    desenharGrafico();
  }

  // LÓGICA DO GRÁFICO (CHART.JS)
  function desenharGrafico() {
    const ctx = document.getElementById('graficoProvas').getContext('2d');
    const modo = document.getElementById('modoVisao').value;
    const container = document.getElementById('containerArea');

    if (meuGrafico) meuGrafico.destroy();

    let labels = [];
    let datasets = [];
    let ehPorcentagem = false;

    if (modo === 'geral') {
      container.style.minWidth = '600px';
      const provas = [...new Set(dadosProvas.map(d => d.prova))];
      labels = provas;

      const medias = provas.map(p => {
        const notas = dadosProvas.filter(d => d.prova === p).map(d => d.nota);
        return (notas.reduce((a, b) => a + b, 0) / (notas.length || 1)).toFixed(1);
      });

      datasets.push({
        label: 'Média da Turma',
        data: medias,
        backgroundColor: provas.map(p => obterCorProva(p)),
        borderRadius: 8
      });

    } else if (modo === 'individual') {
      const provaSel = document.getElementById('selProva1').value;
      const filtrados = dadosProvas.filter(d => d.prova === provaSel);
      ehPorcentagem = filtrados.some(d => d.tipo === 'porcentagem');

      labels = filtrados.map(d => d.aluno);
      container.style.minWidth = Math.max(600, labels.length * 40) + 'px';

      datasets.push({
        label: `Notas - ${provaSel}`,
        data: filtrados.map(d => d.nota),
        backgroundColor: obterCorProva(provaSel),
        borderRadius: 6
      });

    } else if (modo === 'comparar') {
      const p1 = document.getElementById('selProva1').value;
      const p2 = document.getElementById('selProva2').value;

      const alunosUnicos = [...new Set(dadosProvas.map(d => d.aluno))];
      labels = alunosUnicos;
      container.style.minWidth = Math.max(600, labels.length * 50) + 'px';

      const notasP1 = alunosUnicos.map(aluno => {
        const reg = dadosProvas.find(d => d.aluno === aluno && d.prova === p1);
        return reg ? reg.nota : 0;
      });

      const notasP2 = alunosUnicos.map(aluno => {
        const reg = dadosProvas.find(d => d.aluno === aluno && d.prova === p2);
        return reg ? reg.nota : 0;
      });

      datasets.push({
        label: p1,
        data: notasP1,
        backgroundColor: obterCorProva(p1),
        borderRadius: 6
      });

      datasets.push({
        label: p2,
        data: notasP2,
        backgroundColor: obterCorProva(p2),
        borderRadius: 6
      });
    }

    meuGrafico = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { 
            beginAtZero: true, 
            grid: { color: 'rgba(255,255,255,0.08)' }, 
            ticks: { 
              color: '#a0a0b0',
              callback: function(value) {
                return value + (ehPorcentagem ? '%' : '');
              }
            } 
          },
          x: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#a0a0b0', maxRotation: 45, minRotation: 45 } }
        },
        plugins: {
          legend: { labels: { color: '#ffffff', font: { weight: 'bold' } } },
          tooltip: {
            callbacks: {
              label: function(context) {
                let label = context.dataset.label || '';
                if (label) label += ': ';
                if (context.parsed.y !== null) label += context.parsed.y + (ehPorcentagem ? '%' : '');
                return label;
              }
            }
          }
        }
      }
    });
  }

  // Carregar inicial
  atualizarTudo();
</script>

</body>
</html>
